name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Check formatting and lint
        run: |
          python -m black --check src tests
          python -m ruff check src tests
      - name: Type check
        run: python -m mypy src/hybrid_miner
      - name: Test contracts
        run: python -m pytest -q
      - name: Check pinned Hyperon Miner submodule
        run: |
          test "$(git ls-tree HEAD hyperon-miner | cut -f1 | cut -d' ' -f1)" = 160000
          test "$(git rev-parse HEAD:hyperon-miner)" = e955479bca1603597529d175cc22ac1583c67e15
          git config -f .gitmodules --get submodule.hyperon-miner.url

  petta-runtime:
    name: PeTTa admission and mining
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PETTA_ROOT: ${{ runner.temp }}/petta
      MINER_ROOT: ${{ github.workspace }}/hyperon-miner
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install SWI-Prolog and Python bridge dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:swi-prolog/stable
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox python3-scipy
          swipl --version
      - name: Check out pinned PeTTa runtime
        run: |
          git clone --filter=blob:none https://github.com/trueagi-io/PeTTa.git "$PETTA_ROOT"
          git -C "$PETTA_ROOT" checkout ebdb51168135f7fdf68c59acf7521a1b85c19ba0
          test "$(git -C "$PETTA_ROOT" rev-parse HEAD)" = ebdb51168135f7fdf68c59acf7521a1b85c19ba0
          test "$(git -C "$MINER_ROOT" rev-parse HEAD)" = e955479bca1603597529d175cc22ac1583c67e15
      - name: Install hybrid-miner and test dependencies
        run: python -m pip install -e ".[dev]" scipy
      - name: Run pinned PeTTa integration check
        run: python -m pytest tests/integration/test_petta_runtime.py -q --basetemp=runtime-artifacts
      - name: Preserve runtime artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: petta-runtime-failure
          path: runtime-artifacts/
          if-no-files-found: ignore
